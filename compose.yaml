services:
  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.tests
    profiles:
      - test
    restart: "no"

  sashframe-app:
    container_name: sashframe-app
    image: sashframe-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_OPTIONS=--experimental-sqlite
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PHOTO_OUTPUT_DIR=/data/photos/processed
      - PHOTO_MANIFEST=/data/photos/manifest.json
      - SASHFRAME_CALENDAR_PROVIDER=${SASHFRAME_CALENDAR_PROVIDER:-shifter}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-}
      - GOOGLE_CALENDAR_CACHE=/data/calendar/google.json
      - SASHFRAME_TIMEZONE=${SASHFRAME_TIMEZONE:-Europe/London}
      - SHIFTER_INPUT_DIR=/data/calendar
      - SHIFTER_FILE_PATH=/data/calendar/calendar.Shifter
    volumes:
      - ${SASHFRAME_PHOTOS_DIR:-./data/photos}:/data/photos:ro
      - ${SASHFRAME_CALENDAR_DIR:-./data/shifter}:/data/calendar:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4321/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  sashframe-photo-processor:
    image: sashframe-photo-processor:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.photos
    restart: "no"
    profiles:
      - tools
    environment:
      - PYTHONUNBUFFERED=1
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PHOTO_INPUT_DIR=/data/photos/incoming
      - PHOTO_OUTPUT_DIR=/data/photos/processed
      - PHOTO_MANIFEST=/data/photos/manifest.json
      - PHOTO_MAX_SIZE=${PHOTO_MAX_SIZE:-1920}
      - PHOTO_QUALITY=${PHOTO_QUALITY:-85}
    volumes:
      - ${SASHFRAME_PHOTOS_DIR:-./data/photos}:/data/photos:rw

  sashframe-calendar-sync:
    image: sashframe-calendar-sync:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.calendar
    restart: "no"
    profiles:
      - calendar-google
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-}
      - GOOGLE_CALENDAR_CACHE=/data/calendar/google.json
      - GOOGLE_SERVICE_ACCOUNT_FILE=/run/secrets/google-service-account.json
      - SASHFRAME_TIMEZONE=${SASHFRAME_TIMEZONE:-Europe/London}
    volumes:
      - ${SASHFRAME_CALENDAR_DIR:-./data/shifter}:/data/calendar:rw
      - type: bind
        source: ${GOOGLE_SERVICE_ACCOUNT_FILE:-/etc/sashframe/credentials/google-drive.json}
        target: /run/secrets/google-service-account.json
        read_only: true
        bind:
          create_host_path: false
