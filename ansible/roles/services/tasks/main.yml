---
# ==============================================================================
# Sashframe Systemd Services & Timers Management
# ==============================================================================

# 1. Application Repository Deployment
- name: Ensure Sashframe application repository is cloned
  ansible.builtin.git:
    repo: "{{ sashframe_repo_url }}"
    dest: "{{ sashframe_app_dir }}"
    version: "{{ sashframe_repo_version }}"
    force: false
  become: true
  become_user: "{{ sashframe_user }}"

# 2. Clean Up Legacy Systemd Units & Timers
- name: Check if legacy systemd unit files exist
  ansible.builtin.stat:
    path: "{{ systemd_unit_dir }}/{{ item }}"
  loop: "{{ sashframe_legacy_units }}"
  register: legacy_unit_stats

- name: Stop and disable legacy units if present
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ legacy_unit_stats.results }}"
  when: item.stat.exists

- name: Remove legacy systemd unit files
  ansible.builtin.file:
    path: "{{ systemd_unit_dir }}/{{ item.item }}"
    state: absent
  loop: "{{ legacy_unit_stats.results }}"
  when: item.stat.exists
  notify: reload systemd daemon

- name: Ensure legacy timer symlinks are absent
  ansible.builtin.file:
    path: "{{ systemd_unit_dir }}/timers.target.wants/{{ item }}"
    state: absent
  loop:
    - "sashframe-photo-sync.timer"
    - "sashframe-updater.timer"

- name: Ensure superseded legacy scripts and directories are absent
  ansible.builtin.file:
    path: "{{ sashframe_app_dir }}/{{ item }}"
    state: absent
  loop:
    - "scripts/install.sh"
    - "scripts/setup-google-drive.sh"
    - "scripts/setup-google-drive-shifter.sh"
    - "daemon.py"
    - "systemd"

# 2. Transparent Cursor Theme for Kiosk
- name: Configure transparent cursor theme for kiosk display
  ansible.builtin.include_tasks: cursor.yml

# 3. Ensure Shell Scripts Are Executable
- name: Ensure repository helper scripts are executable
  ansible.builtin.file:
    path: "{{ sashframe_app_dir }}/scripts/{{ item }}"
    mode: "0755"
  loop:
    - start-app.sh
    - start.sh
    - sync-photos.sh
    - process-photos.sh
    - sync-shifter.sh
    - update.sh

# 4. Deploy Systemd Unit Templates
- name: Deploy Sashframe systemd unit files
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ sashframe_systemd_units }}"
  notify: reload systemd daemon

- name: Flush handlers to reload systemd daemon if units changed
  ansible.builtin.meta: flush_handlers

# 5. Build Initial Docker Images (if missing)
- name: Check if sashframe-app Docker image already exists
  ansible.builtin.command:
    cmd: "docker image inspect sashframe-app:latest"
  register: app_image_check
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

- name: Build initial Sashframe Docker container images
  ansible.builtin.command:
    cmd: "docker compose --env-file {{ sashframe_config_root }}/sashframe.env --profile tools build"
    chdir: "{{ sashframe_app_dir }}"
  become: true
  become_user: "{{ sashframe_user }}"
  when: not ansible_check_mode and app_image_check.rc != 0

- name: Determine local Git commit SHA
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ sashframe_app_dir }}"
  register: local_git_sha_cmd
  changed_when: false
  when: not ansible_check_mode and app_image_check.rc != 0

- name: Tag initial Docker images with Git SHA
  ansible.builtin.command:
    cmd: "docker tag sashframe-app:latest sashframe-app:{{ local_git_sha_cmd.stdout[:8] }}"
  become: true
  become_user: "{{ sashframe_user }}"
  when: not ansible_check_mode and app_image_check.rc != 0

- name: Tag initial photo processor Docker image with Git SHA
  ansible.builtin.command:
    cmd: "docker tag sashframe-photo-processor:latest sashframe-photo-processor:{{ local_git_sha_cmd.stdout[:8] }}"
  become: true
  become_user: "{{ sashframe_user }}"
  when: not ansible_check_mode and app_image_check.rc != 0

- name: Record initial deployed SHA state
  ansible.builtin.copy:
    content: "{{ local_git_sha_cmd.stdout }}\n"
    dest: "{{ sashframe_data_root }}/state/deployed-sha"
    owner: "{{ sashframe_user }}"
    group: "{{ sashframe_group }}"
    mode: "0644"
  when: not ansible_check_mode and app_image_check.rc != 0

# 6. Manage Service and Timer States & Enablement
- name: Ensure sashframe-app.service is enabled and started
  ansible.builtin.systemd_service:
    name: sashframe-app.service
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Ensure sashframe-app.service is enabled in check mode
  ansible.builtin.systemd_service:
    name: sashframe-app.service
    enabled: true
  when: ansible_check_mode

- name: Ensure sashframe-kiosk.service is enabled and started
  ansible.builtin.systemd_service:
    name: sashframe-kiosk.service
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Ensure sashframe-kiosk.service is enabled in check mode
  ansible.builtin.systemd_service:
    name: sashframe-kiosk.service
    enabled: true
  when: ansible_check_mode

- name: Ensure sashframe-photo-sync.service is enabled
  ansible.builtin.systemd_service:
    name: sashframe-photo-sync.service
    enabled: true

- name: Ensure sashframe-updater.service is enabled (power-on only)
  ansible.builtin.systemd_service:
    name: sashframe-updater.service
    enabled: true

- name: Ensure sashframe-shifter-sync.timer is enabled and started
  ansible.builtin.systemd_service:
    name: sashframe-shifter-sync.timer
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Ensure sashframe-shifter-sync.timer is enabled in check mode
  ansible.builtin.systemd_service:
    name: sashframe-shifter-sync.timer
    enabled: true
  when: ansible_check_mode

# 7. Verification and Health Checking
- name: Verify systemd units are installed
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ sashframe_systemd_units }}"
  register: installed_unit_stats

- name: Assert systemd units integrity
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.mode == '0644'
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
    fail_msg: "Installed unit '{{ item.item.dest }}' does not have expected mode or ownership."
  loop: "{{ installed_unit_stats.results }}"
  when: not ansible_check_mode

- name: Check status of shifter sync timer
  ansible.builtin.command: systemctl is-active sashframe-shifter-sync.timer
  register: timer_status_cmd
  changed_when: false
  when: not ansible_check_mode

- name: Assert shifter sync timer is active
  ansible.builtin.assert:
    that:
      - timer_status_cmd.stdout == 'active'
    fail_msg: "sashframe-shifter-sync.timer is not active!"
  when: not ansible_check_mode

- name: Check status of kiosk service
  ansible.builtin.command: systemctl is-active sashframe-kiosk.service
  register: kiosk_status_cmd
  changed_when: false
  when: not ansible_check_mode

- name: Assert kiosk service is active
  ansible.builtin.assert:
    that:
      - kiosk_status_cmd.stdout == 'active'
    fail_msg: "sashframe-kiosk.service is not active!"
  when: not ansible_check_mode

- name: Check application health endpoint
  ansible.builtin.uri:
    url: "{{ sashframe_health_url }}"
    status_code: 200
    return_content: true
  register: health_resp
  retries: 5
  delay: 2
  until: health_resp.status == 200
  when: not ansible_check_mode

- name: Assert application health response
  ansible.builtin.assert:
    that:
      - health_resp.json.status == 'ok'
    fail_msg: "Application health check failed: {{ health_resp.content | default('no response') }}"
  when: not ansible_check_mode

# 8. Host Reboot to Exercise Power-On Lifecycle (Photo Sync & Kiosk)
- name: Reboot Sashframe host to complete initial provisioning and run boot services
  ansible.builtin.reboot:
    msg: "Rebooting Sashframe appliance after successful provisioning to initiate power-on services."
    reboot_timeout: "{{ sashframe_reboot_timeout }}"
    post_reboot_delay: 15
  when:
    - not ansible_check_mode
    - sashframe_reboot_on_completion | default(true) | bool

- name: Wait for application health endpoint post-reboot
  ansible.builtin.uri:
    url: "{{ sashframe_health_url }}"
    status_code: 200
    return_content: true
  register: post_reboot_health
  retries: 30
  delay: 5
  until: post_reboot_health.status == 200
  when:
    - not ansible_check_mode
    - sashframe_reboot_on_completion | default(true) | bool

- name: Assert post-reboot application health response
  ansible.builtin.assert:
    that:
      - post_reboot_health.json.status == 'ok'
    fail_msg: "Application is not healthy post-reboot: {{ post_reboot_health.content | default('no response') }}"
  when:
    - not ansible_check_mode
    - sashframe_reboot_on_completion | default(true) | bool

- name: Verify kiosk service is active post-reboot
  ansible.builtin.command: systemctl is-active sashframe-kiosk.service
  register: post_reboot_kiosk_status
  changed_when: false
  when:
    - not ansible_check_mode
    - sashframe_reboot_on_completion | default(true) | bool

- name: Assert kiosk service is active post-reboot
  ansible.builtin.assert:
    that:
      - post_reboot_kiosk_status.stdout == 'active'
    fail_msg: "sashframe-kiosk.service is not active post-reboot!"
  when:
    - not ansible_check_mode
    - sashframe_reboot_on_completion | default(true) | bool

