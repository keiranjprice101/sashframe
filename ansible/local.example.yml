---
# Sashframe Local Installation Variables (Template)
# Copy this file to ansible/local.yml (which is gitignored) and customize for your appliance.

# Calendar provider: shifter (default) or google; also accepted via -e
sashframe_calendar_provider: "shifter"
# Required only with provider google. Share this calendar with the service account.
sashframe_google_calendar_id: ""

# Google Drive Photo and Shifter Folder IDs (Shifter required only in shifter mode)
sashframe_photo_drive_folder_id: "YOUR_GOOGLE_DRIVE_PHOTO_FOLDER_ID"
sashframe_shifter_drive_folder_id: "YOUR_GOOGLE_DRIVE_SHIFTER_FOLDER_ID"

# Path to the Google Service Account JSON file on your Ansible controller machine
# (Do NOT commit the JSON file to git; provide its local path here)
sashframe_google_service_account_src: "/path/to/google-service-account.json"

# Appliance Timezone & Geographical Coordinates
sashframe_timezone: "Europe/London"
sashframe_latitude: 51.453
sashframe_longitude: -0.902

# Optional: Application Repository Path Override (defaults to /home/{{ sashframe_user }}/sashframe)
# sashframe_app_dir: "/home/sham/sashframe"

# Optional: Automatically reboot appliance at the end of provisioning to start boot services (defaults to true)
# sashframe_reboot_on_completion: true

